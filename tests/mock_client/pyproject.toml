[project]
name = "eqclient"
version = "0.1.0"
description = "Titanium EQEmu client for integration tests"
requires-python = ">=3.14,<3.15"
dependencies = [
    "pycryptodome",
    "requests",
    "beautifulsoup4",
    "lxml",
    "numpy",
    "sentence-transformers",
    "torch",
]

[project.optional-dependencies]
test = ["pytest"]
lint = ["black>=24.10.0", "mypy>=1.13", "isort>=9.0.2"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = [".", "tests/eqclient1", "tests/eqclient3"]

[tool.black]
line-length = 100
target-version = ["py313"]

[tool.mypy]
python_version = "3.13"
mypy_path = "."
files = ["eqclient3"]
explicit_package_bases = true
warn_unused_configs = true
warn_redundant_casts = true
warn_unused_ignores = true
check_untyped_defs = true
disallow_untyped_defs = true
no_implicit_optional = true
strict_equality = true

[[tool.mypy.overrides]]
module = ["Crypto", "Crypto.*"]
ignore_missing_imports = true

[tool.uv.sources]
torch = { path = "torch-2.15.0a0+git31a77fc-cp314-cp314-macosx_15_0_x86_64.whl" }
